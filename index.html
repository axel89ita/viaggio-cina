<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Viaggio in Cina</title>
  <meta name="theme-color" content="#7f1d17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cina">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/pennello.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="banner-test"></div>

  <header class="testata">
    <button class="btn-indietro" id="btn-indietro" hidden aria-label="Indietro">‹</button>
    <div class="sigillo-mini" aria-hidden="true">旅</div>
    <h1 id="titolo-testata">Viaggio in Cina</h1>
    <button class="btn-aiuto" id="btn-aiuto" aria-label="Aiuto">?</button>
  </header>

  <main>
    <section class="vista" id="v-home"></section>
    <section class="vista" id="v-itinerario"></section>
    <section class="vista" id="v-mangiare"></section>
    <section class="vista" id="v-frasario"></section>
    <section class="vista" id="v-passaporto"></section>
    <section class="vista" id="v-sfida"></section>
  </main>

  <nav class="barra" id="barra"></nav>

  <!-- Schermo intero: tassista / frase -->
  <div class="schermo-intero ruotabile" id="schermo-intero">
    <div class="si-barra">
      <button class="chiudi" id="si-ruota">↻ Gira in orizzontale</button>
      <button class="chiudi" id="si-chiudi">Chiudi ✕</button>
    </div>
    <div class="centro" id="si-centro"></div>
  </div>

  <!-- Foglio dal basso (aiuto, dettagli, test) -->
  <div class="velo" id="velo"><div class="foglio" id="foglio"></div></div>

  <!-- Avviso -->
  <div class="toast" id="toast"><div class="t" id="toast-t"></div><div id="toast-az"></div></div>

  <!-- Festa di sblocco -->
  <div class="festa" id="festa"></div>
  <canvas id="coriandoli" hidden></canvas>

  <input type="file" id="input-selfie" accept="image/*" capture="user" hidden>

  <script src="js/config.js"></script>
  <script src="js/contenuti.js"></script>
  <script src="js/audio-frasi.js"></script>
  <script src="js/itinerario.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
